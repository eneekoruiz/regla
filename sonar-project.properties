# Análisis de SonarCloud (SonarQube Cloud).
# Si el proyecto se importó con otra clave u organización, ajústalas aquí.
sonar.projectKey=eneekoruiz_regla
sonar.organization=eneekoruiz
sonar.projectName=Aura · Ciclo menstrual

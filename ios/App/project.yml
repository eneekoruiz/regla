# Run `xcodegen generate` in this directory on macOS to include the widget target.
name: App
options:
  bundleIdPrefix: app.aura.privatecycle
  deploymentTarget:
    iOS: '17.0'
packages:
  CapApp-SPM:
    path: CapApp-SPM
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [public, capacitor.config.json, config.xml]
    resources:
      - App/public
      - App/capacitor.config.json
      - App/config.xml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aura.privatecycle
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Aura.entitlements
        SWIFT_VERSION: '5.0'
    dependencies:
      - package: CapApp-SPM
      - target: AuraWidget
        embed: true
  AuraWidget:
    type: app-extension
    platform: iOS
    sources: [AuraWidget]
    info:
      path: AuraWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aura.privatecycle.widget
        CODE_SIGN_ENTITLEMENTS: AuraWidget/Widget.entitlements
        SWIFT_VERSION: '5.0'
